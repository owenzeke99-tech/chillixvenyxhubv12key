
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chilli X Venyx V12</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --red: #ff2525;
    --red2: #ff0000;
    --dark: #080808;
}

body {
    min-height: 100vh;
    background: #050505;
    color: white;
    font-family: Inter, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* ========== BACKGROUND ========== */

.bg {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 15% 15%, #380707 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, #300000 0%, transparent 40%),
        #050505;
    z-index: -5;
}

.bg-grid {
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(255,0,0,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,0,0,.055) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridScroll 25s linear infinite;
    mask-image: linear-gradient(to bottom, black, transparent);
    z-index: -4;
}

@keyframes gridScroll {
    to { background-position: 40px 40px; }
}

.glow {
    position: fixed;
    width: 300px;
    height: 300px;
    background: red;
    border-radius: 50%;
    filter: blur(120px);
    opacity: .12;
    z-index: -3;
    animation: glowMove 12s ease-in-out infinite alternate;
}

.glow-a {
    left: -100px;
    top: -100px;
}

.glow-b {
    right: -100px;
    bottom: -100px;
    animation-delay: -5s;
}

@keyframes glowMove {
    0% { transform: translate(0,0) scale(.8); }
    100% { transform: translate(120px,80px) scale(1.3); }
}

/* LIGHTNING */

.lightning {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    z-index: -2;
    pointer-events: none;
    animation: lightning 12s infinite;
}

@keyframes lightning {
    0%, 35%, 37%, 80%, 82%, 100% { opacity: 0; }
    36% { opacity: .025; }
    81% { opacity: .018; }
}

/* ========== PARTICLES ========== */

#particles {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: -1;
}

.particle {
    position: absolute;
    border-radius: 50%;
    background: #ff3030;
    box-shadow: 0 0 10px #ff0000;
    animation: particleUp linear infinite;
}

@keyframes particleUp {
    0% {
        transform: translateY(110vh) translateX(0) scale(.3);
        opacity: 0;
    }
    15% { opacity: .8; }
    85% { opacity: .6; }
    100% {
        transform: translateY(-10vh) translateX(80px) scale(1.5);
        opacity: 0;
    }
}

/* ========== MENU INTRO ========== */

.container {
    width: 92%;
    max-width: 440px;
    perspective: 1200px;
    animation: entrance 1.2s cubic-bezier(.16,1,.3,1);
}

@keyframes entrance {
    0% {
        opacity: 0;
        transform: translateY(60px) rotateX(20deg) scale(.8);
        filter: blur(10px);
    }
    70% {
        opacity: 1;
        filter: blur(0);
    }
    100% {
        transform: translateY(0) rotateX(0) scale(1);
    }
}

/* ========== MAIN MENU ========== */

.menu {
    position: relative;
    padding: 30px 23px 25px;
    border-radius: 28px;
    background: rgba(10,10,10,.95);
    border: 1px solid rgba(255,30,30,.3);
    backdrop-filter: blur(25px);
    overflow: hidden;
    transform-style: preserve-3d;

    box-shadow:
        0 0 20px rgba(255,0,0,.08),
        0 0 80px rgba(255,0,0,.08),
        0 30px 100px rgba(0,0,0,.9),
        inset 0 0 30px rgba(255,0,0,.025);

    transition: transform .2s ease;
}

/* Animated neon border */

.menu::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 30px;
    background: conic-gradient(
        from 0deg,
        transparent,
        #ff0000,
        #ff5555,
        transparent,
        #7a0000,
        #ff0000,
        transparent
    );
    animation: borderSpin 5s linear infinite;
    z-index: -1;
}

.menu::after {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: 27px;
    background: #090909;
    z-index: -1;
}

@keyframes borderSpin {
    to { transform: rotate(360deg); }
}

/* MENU LIGHT SCAN */

.scan {
    position: absolute;
    top: -100%;
    left: 0;
    width: 100%;
    height: 70%;
    background: linear-gradient(
        transparent,
        rgba(255,0,0,.055),
        rgba(255,255,255,.015),
        transparent
    );
    animation: scanMove 6s ease-in-out infinite;
    pointer-events: none;
}

@keyframes scanMove {
    0%, 100% { top: -100%; }
    50% { top: 130%; }
}

/* Light spot */

.light-spot {
    position: absolute;
    width: 180px;
    height: 180px;
    background: rgba(255,0,0,.1);
    filter: blur(80px);
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    animation: spotPulse 4s infinite alternate;
}

@keyframes spotPulse {
    from { opacity: .2; transform: translateX(-50%) scale(.7); }
    to { opacity: .8; transform: translateX(-50%) scale(1.3); }
}

/* ========== LOGO ========== */

.logo-area {
    position: relative;
    width: 110px;
    height: 110px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(255,30,30,.4);
    animation: rotateRing 7s linear infinite;
}

.logo-ring::before,
.logo-ring::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: red;
    box-shadow: 0 0 15px red;
}

.logo-ring::before {
    top: 8px;
    left: 15px;
}

.logo-ring::after {
    right: 10px;
    bottom: 15px;
}

.ring-2 {
    inset: 10px;
    border-style: dashed;
    border-color: rgba(255,80,80,.25);
    animation-direction: reverse;
    animation-duration: 12s;
}

.ring-3 {
    inset: -8px;
    border: 1px solid transparent;
    border-left-color: rgba(255,0,0,.5);
    border-right-color: rgba(255,0,0,.5);
    animation-duration: 4s;
}

@keyframes rotateRing {
    to { transform: rotate(360deg); }
}

.logo {
    width: 73px;
    height: 73px;
    border-radius: 24px;
    background: linear-gradient(145deg, #ff3030, #780000, #300000);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    position: relative;
    box-shadow:
        0 0 20px rgba(255,0,0,.4),
        0 0 50px rgba(255,0,0,.2),
        inset 0 0 15px rgba(255,255,255,.1);
    animation: logoBounce 3s ease-in-out infinite;
}

.logo::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 27px;
    border: 1px solid rgba(255,80,80,.35);
    animation: logoBorder 2s ease-in-out infinite;
}

@keyframes logoBounce {
    0%,100% {
        transform: translateY(0) rotate(-5deg);
    }
    50% {
        transform: translateY(-8px) rotate(5deg);
    }
}

@keyframes logoBorder {
    0%,100% {
        transform: scale(1);
        opacity: .4;
    }
    50% {
        transform: scale(1.12);
        opacity: 1;
    }
}

/* ========== TITLE ========== */

.title {
    font-family: Orbitron, sans-serif;
    text-align: center;
    font-size: clamp(17px, 5vw, 24px);
    font-weight: 900;
    letter-spacing: 1px;

    background: linear-gradient(
        90deg,
        #ffffff,
        #ff3030,
        #ffaaaa,
        #ff0000,
        #ffffff
    );

    background-size: 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation: titleFlow 5s linear infinite, titlePulse 3s ease-in-out infinite;
}

@keyframes titleFlow {
    to { background-position: 300%; }
}

@keyframes titlePulse {
    0%,100% { filter: drop-shadow(0 0 0px red); }
    50% { filter: drop-shadow(0 0 8px rgba(255,0,0,.3)); }
}

.subtitle {
    margin-top: 9px;
    text-align: center;
    font-size: 10px;
    color: #777;
    letter-spacing: 4px;
    animation: fadePulse 3s infinite;
}

@keyframes fadePulse {
    0%,100% { opacity: .5; }
    50% { opacity: 1; }
}

/* ========== STATUS ========== */

.status-wrap {
    display: flex;
    justify-content: center;
    margin: 22px 0;
}

.status {
    position: relative;
    padding: 9px 17px;
    border-radius: 30px;
    background: rgba(255,0,0,.06);
    border: 1px solid rgba(255,0,0,.25);
    color: #ff7373;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    overflow: hidden;
}

.status::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
    animation: statusShine 3s infinite;
}

@keyframes statusShine {
    to { left: 100%; }
}

.status-dot {
    width: 7px;
    height: 7px;
    background: #ff2525;
    border-radius: 50%;
    box-shadow: 0 0 12px red;
    animation: dotBlink 1.2s infinite;
}

@keyframes dotBlink {
    50% { opacity: .3; transform: scale(.7); }
}

/* ========== DIVIDER ========== */

.divider {
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        #400000,
        #ff3030,
        #400000,
        transparent
    );
    position: relative;
    margin: 22px 0;
    animation: dividerGlow 3s infinite;
}

@keyframes dividerGlow {
    50% { filter: brightness(2); }
}

/* ========== KEY BOX ========== */

.key-section {
    position: relative;
    animation: sectionAppear .8s ease .3s both;
}

@keyframes sectionAppear {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

.label {
    color: #777;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 11px;
}

.key-box {
    position: relative;
    border-radius: 15px;
    padding: 17px 14px;
    background: linear-gradient(135deg, #080808, #150707, #080808);
    border: 1px solid #352020;
    overflow: hidden;
    transition: .35s;
}

.key-box:hover {
    border-color: #ff3333;
    transform: scale(1.015);
    box-shadow: 0 0 25px rgba(255,0,0,.15);
}

/* Key moving light */

.key-box::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #ff0000, white, red, transparent);
    animation: keyLight 3s linear infinite;
}

@keyframes keyLight {
    to { left: 100%; }
}

.key-box::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 35%, rgba(255,0,0,.06), transparent 65%);
    transform: translateX(-100%);
    animation: keySweep 5s ease-in-out infinite;
}

@keyframes keySweep {
    0%, 60% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

.key-text {
    position: relative;
    z-index: 2;
    color: #ff5252;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.8;
    word-break: break-all;
    text-shadow: 0 0 12px rgba(255,0,0,.3);
    user-select: all;
}

/* ========== COPY BUTTON ========== */

.copy-btn {
    position: relative;
    width: 100%;
    margin-top: 14px;
    padding: 17px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(100deg, #850000, #ff2020, #850000);
    background-size: 300%;
    color: white;
    font-family: Orbitron, sans-serif;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1.5px;
    cursor: pointer;
    overflow: hidden;

    box-shadow:
        0 5px 20px rgba(255,0,0,.2),
        inset 0 0 15px rgba(255,255,255,.08);

    animation: buttonColor 5s linear infinite;
    transition: .25s;
}

@keyframes buttonColor {
    to { background-position: 300%; }
}

.copy-btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 35px rgba(255,0,0,.4);
}

.copy-btn:active {
    transform: scale(.94);
}

/* BUTTON SHINE */

.btn-shine {
    position: absolute;
    top: -50%;
    left: -100%;
    width: 60%;
    height: 200%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
    transform: rotate(25deg);
    animation: btnShine 3.5s ease-in-out infinite;
}

@keyframes btnShine {
    0%,30% { left: -100%; }
    70%,100% { left: 150%; }
}

.btn-text {
    position: relative;
    z-index: 2;
}

/* LOADING */

.loading {
    display: none;
    justify-content: center;
    gap: 5px;
    margin-top: 12px;
}

.loading.active {
    display: flex;
}

.loading span {
    width: 5px;
    height: 5px;
    background: #ff3333;
    border-radius: 50%;
    animation: loadingDot .7s infinite alternate;
}

.loading span:nth-child(2) { animation-delay: .2s; }
.loading span:nth-child(3) { animation-delay: .4s; }

@keyframes loadingDot {
    from { transform: translateY(0); opacity: .3; }
    to { transform: translateY(-6px); opacity: 1; }
}

/* ========== NOTIFICATION ========== */

.notification {
    height: 0;
    opacity: 0;
    overflow: hidden;
    margin-top: 0;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #ff7777;
    font-size: 11px;
    font-weight: 700;
    transition: .4s;
}

.notification.show {
    height: 38px;
    margin-top: 10px;
    opacity: 1;
    background: rgba(255,0,0,.07);
    border: 1px solid rgba(255,0,0,.2);
    animation: notificationPop .4s cubic-bezier(.2,1.5,.5,1);
}

@keyframes notificationPop {
    from { transform: scale(.85); }
    to { transform: scale(1); }
}

.notification-icon {
    animation: successRotate .5s ease;
}

@keyframes successRotate {
    from { transform: rotate(-180deg) scale(0); }
    to { transform: rotate(0) scale(1); }
}

/* ========== FOOTER ========== */

.footer {
    text-align: center;
    color: #444;
    font-size: 9px;
    letter-spacing: 1.5px;
    line-height: 2.2;
    margin-top: 22px;
    animation: footerFade 3s infinite;
}

.footer strong {
    color: #bd2929;
}

@keyframes footerFade {
    0%,100% { opacity: .6; }
    50% { opacity: 1; }
}

/* CORNERS */

.corner {
    position: absolute;
    width: 22px;
    height: 22px;
    border: 1px solid rgba(255,0,0,.4);
    z-index: 4;
    animation: cornerPulse 3s infinite;
}

.c1 {
    top: 12px;
    left: 12px;
    border-right: 0;
    border-bottom: 0;
    border-radius: 7px 0 0 0;
}

.c2 {
    top: 12px;
    right: 12px;
    border-left: 0;
    border-bottom: 0;
    border-radius: 0 7px 0 0;
}

.c3 {
    bottom: 12px;
    left: 12px;
    border-right: 0;
    border-top: 0;
    border-radius: 0 0 0 7px;
}

.c4 {
    bottom: 12px;
    right: 12px;
    border-left: 0;
    border-top: 0;
    border-radius: 0 0 7px 0;
}

@keyframes cornerPulse {
    0%,100% { opacity: .3; }
    50% { opacity: 1; box-shadow: 0 0 10px rgba(255,0,0,.15); }
}

/* MOBILE */

@media(max-width:400px) {
    .menu {
        padding: 26px 18px 22px;
    }

    .logo-area {
        width: 95px;
        height: 95px;
    }

    .logo {
        width: 65px;
        height: 65px;
        font-size: 36px;
    }

    .key-text {
        font-size: 10px;
    }
}

/* REDUCED MOTION */

@media(prefers-reduced-motion:reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="bg-grid"></div>
<div class="glow glow-a"></div>
<div class="glow glow-b"></div>
<div class="lightning"></div>
<div id="particles"></div>

<div class="container">

<div class="menu" id="menu">

    <div class="scan"></div>
    <div class="light-spot"></div>

    <div class="corner c1"></div>
    <div class="corner c2"></div>
    <div class="corner c3"></div>
    <div class="corner c4"></div>

    <!-- LOGO -->
    <div class="logo-area">
        <div class="logo-ring"></div>
        <div class="logo-ring ring-2"></div>
        <div class="logo-ring ring-3"></div>
        <div class="logo">🌶️</div>
    </div>

    <!-- TITLE -->
    <div class="title">
        CHILLI X VENYX V12
    </div>

    <div class="subtitle">
        PREMIUM KEY SYSTEM
    </div>

    <!-- STATUS -->
    <div class="status-wrap">
        <div class="status">
            <span class="status-dot"></span>
            SYSTEM ONLINE
        </div>
    </div>

    <div class="divider"></div>

    <!-- KEY MENU -->
    <div class="key-section">

        <div class="label">
            YOUR PERSONAL ACCESS KEY
        </div>

        <div class="key-box">
            <div class="key-text" id="keyText">
                ChilliXVenyxV12SonHuyKeyJsjsbwkwjLzkwhkwwjLakbwkwoweij
            </div>
        </div>

        <!-- COPY BUTTON -->
        <button class="copy-btn" id="copyBtn" onclick="copyKey()">
            <span class="btn-shine"></span>
            <span class="btn-text" id="buttonText">
                ⧉ &nbsp; COPY KEY
            </span>
        </button>

        <!-- LOADING DOTS -->
        <div class="loading" id="loading">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- MENU NOTIFICATION -->
        <div class="notification" id="notification">
            <span class="notification-icon" id="notificationIcon">✓</span>
            <span id="notificationText">KEY COPIED SUCCESSFULLY!</span>
        </div>

    </div>

    <div class="divider"></div>

    <div class="footer">
        SECURE ACCESS • PREMIUM EXPERIENCE
        <br>
        POWERED BY <strong>CHILLI X VENYX</strong>
        <br>
        © 2026 ALL RIGHTS RESERVED
    </div>

</div>
</div>

<script>
const KEY = "ChilliXVenyxV12SonHuyKeyJsjsbwkwjLzkwhkwwjLakbwkwoweij";

const menu = document.getElementById("menu");
const copyBtn = document.getElementById("copyBtn");
const buttonText = document.getElementById("buttonText");
const notification = document.getElementById("notification");
const notificationText = document.getElementById("notificationText");
const notificationIcon = document.getElementById("notificationIcon");
const loading = document.getElementById("loading");

/* COPY KEY */

async function copyKey() {
    if (copyBtn.disabled) return;

    copyBtn.disabled = true;
    loading.classList.add("active");
    notification.classList.remove("show");

    buttonText.textContent = "COPYING KEY...";

    await new Promise(resolve => setTimeout(resolve, 700));

    let success = false;

    try {
        await navigator.clipboard.writeText(KEY);
        success = true;
    } catch (e) {
        const textarea = document.createElement("textarea");

        textarea.value = KEY;
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        textarea.style.top = "0";

        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();

        try {
            success = document.execCommand("copy");
        } catch (error) {
            success = false;
        }

        textarea.remove();
    }

    loading.classList.remove("active");

    if (success) {
        buttonText.textContent = "✓ KEY COPIED";
        notificationIcon.textContent = "✓";
        notificationText.textContent = "KEY COPIED SUCCESSFULLY!";
        notification.classList.add("show");

        copyBtn.style.boxShadow = "0 0 35px rgba(255,0,0,.45)";

        setTimeout(() => {
            buttonText.innerHTML = "⧉ &nbsp; COPY KEY";
            copyBtn.style.boxShadow = "";
        }, 2200);

    } else {
        buttonText.textContent = "COPY KEY";
        notificationIcon.textContent = "!";
        notificationText.textContent = "COPY FAILED - COPY MANUALLY";
        notification.classList.add("show");
    }

    copyBtn.disabled = false;

    setTimeout(() => {
        notification.classList.remove("show");
    }, 3500);
}

/* PARTICLES */

const particleContainer = document.getElementById("particles");

for (let i = 0; i < 60; i++) {
    const particle = document.createElement("div");

    particle.className = "particle";
    particle.style.left = Math.random() * 100 + "%";
    particle.style.animationDuration = (5 + Math.random() * 14) + "s";
    particle.style.animationDelay = Math.random() * 12 + "s";

    const size = 1 + Math.random() * 3;
    particle.style.width = size + "px";
    particle.style.height = size + "px";

    particleContainer.appendChild(particle);
}

/* 3D MENU TILT - DESKTOP */

if (window.matchMedia("(pointer:fine)").matches) {

    menu.addEventListener("mousemove", (e) => {
        const rect = menu.getBoundingClientRect();

        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;

        const rotateY = (x - .5) * 8;
        const rotateX = (.5 - y) * 8;

        menu.style.transform =
            `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    menu.addEventListener("mouseleave", () => {
        menu.style.transform =
            "perspective(1000px) rotateX(0deg) rotateY(0deg)";
    });
}

/* BUTTON RIPPLE */

copyBtn.addEventListener("click", function(e) {
    const ripple = document.createElement("span");

    const rect = this.getBoundingClientRect();

    ripple.style.position = "absolute";
    ripple.style.width = "15px";
    ripple.style.height = "15px";
    ripple.style.borderRadius = "50%";
    ripple.style.background = "rgba(255,255,255,.4)";
    ripple.style.transform = "scale(0)";
    ripple.style.pointerEvents = "none";
    ripple.style.left = (e.clientX - rect.left) + "px";
    ripple.style.top = (e.clientY - rect.top) + "px";

    ripple.animate([
        { transform: "scale(0)", opacity: 1 },
        { transform: "scale(20)", opacity: 0 }
    ], {
        duration: 600,
        easing: "ease-out"
    });

    this.appendChild(ripple);

    setTimeout(() => ripple.remove(), 650);
});
</script>

</body>
